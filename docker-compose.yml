version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ner-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ner-backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ner_logistics
      - JWT_SECRET=ner_logistics_tactical_command_secret_2026_super_secure_key
      - GEMINI_API_KEY=AIzaSyAJEN73r0UehQZnLsDx38csMIrV1KGlYY4
      - CLIENT_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ner-frontend
    ports:
      - '5173:5173'
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
